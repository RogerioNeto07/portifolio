<div>
  <a href="/" class="return_link">
    <i class="fas fa-arrow-left"></i>
  </a>
</div>

<h2 class="titulo-pagina">Projetos:</h2>

<div class="projetos-grid">
  @for (item of meusProjetos(); track item.nome) {
    <div class="animar-card wrapper-card">
      <app-card-projeto 
        [projeto]="item" 
        (clicado)="aviso($event)">
      </app-card-projeto>
    </div>
  } @empty {
    <p>Nenhum projeto encontrado.</p>
  }
</div>
